name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check required files
        run: test -f index.html && test -f style.css && test -f README.md && test -f VERSION
      - name: Check local asset references
        run: |
          grep -q 'game.js' index.html
          grep -q 'style.css' index.html
          grep -q 'FlappyPy' README.md
      - name: Check whitespace
        run: git diff --check
